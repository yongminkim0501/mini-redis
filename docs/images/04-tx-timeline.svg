<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="서버는 한 번에 하나씩 실행한다"><title>서버는 한 번에 하나씩 실행한다</title><desc>트랜잭션 없이는 이체 두 요청 사이에 읽기가 끼어들어 합계 990을 보지만, 트랜잭션은 한 덩어리라 항상 1000이다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="438" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">서버는 한 번에 하나씩 실행한다 — 그 사이에 읽으면?</text><text x="28" y="88" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">초기 상태  a = 1000, b = 0   (합계는 항상 1000이어야 한다)</text><text x="28" y="150" font-size="18" fill="#a63f16" font-weight="700" text-anchor="start">트랜잭션 없음</text><text x="28" y="174" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">(요청 2개로 나눔)</text><rect x="300" y="120" width="170" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="385.0" y="151.5" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">① a −10</text><text x="385.0" y="170.8" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">a=990  b=0</text><rect x="488" y="120" width="200" height="70" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="2.5"/><text x="588.0" y="150.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">다른 요청: 읽기</text><text x="588.0" y="171.1" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">a + b = 990  ✗ 틀림</text><rect x="706" y="120" width="170" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="791.0" y="151.5" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">② b +10</text><text x="791.0" y="170.8" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">a=990  b=10</text><text x="588" y="212" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">중간 상태가 보인다</text><line x1="28" y1="244" x2="932" y2="244" stroke="#e1e0d9" stroke-width="1.5"/><text x="28" y="312" font-size="18" fill="#184f95" font-weight="700" text-anchor="start">트랜잭션</text><text x="28" y="336" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">(요청 1개로 묶음)</text><rect x="300" y="282" width="170" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="385.0" y="312.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">읽기</text><text x="385.0" y="333.1" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">a + b = 1000  ✓</text><rect x="488" y="282" width="270" height="70" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="3"/><text x="623" y="312" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">트랜잭션: a −10, b +10</text><text x="623" y="336" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">a=990  b=10   (한 덩어리)</text><rect x="776" y="282" width="150" height="70" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="851.0" y="312.8" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="middle">읽기</text><text x="851.0" y="333.1" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">a + b = 1000  ✓</text><text x="623" y="374" font-size="14" fill="#184f95" font-weight="700" text-anchor="middle">중간에 끼어들 수 없다</text><line x1="300" y1="410" x2="930" y2="410" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah-ink)"/><text x="930" y="430" font-size="13" fill="#52514e" font-weight="600" text-anchor="end">시간 →</text><text x="300" y="430" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">서버가 요청을 하나씩 순서대로 실행</text></svg>