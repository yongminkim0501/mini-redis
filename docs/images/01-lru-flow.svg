<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="LRU 동작 순서 (최대 3개)"><title>LRU 동작 순서 (최대 3개)</title><desc>a,b,c 저장, a를 읽으면 맨 앞으로 이동, d를 저장하면 가득 차서 맨 뒤의 b가 축출된다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="498" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">읽으면 앞으로, 가득 차면 뒤에서 버린다 (최대 3개)</text><circle cx="46" cy="114" r="15" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="46" y="119.76" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="76" y="108" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">a, b, c 를 차례로 저장</text><text x="76" y="132" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">(맨 앞 = 가장 최근 · 맨 뒤 = 가장 오래됨)</text><text x="495" y="82" font-size="13" fill="#184f95" font-weight="600" text-anchor="middle">head</text><text x="755" y="82" font-size="13" fill="#a63f16" font-weight="600" text-anchor="middle">tail</text><rect x="440" y="90" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="495" y="123" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">c</text><line x1="552" y1="115" x2="568" y2="115" stroke="#52514e" stroke-width="1.8"/><rect x="570" y="90" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="625" y="123" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">b</text><line x1="682" y1="115" x2="698" y2="115" stroke="#52514e" stroke-width="1.8"/><rect x="700" y="90" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="755" y="123" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">a</text><line x1="28" y1="200" x2="932" y2="200" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="46" cy="256" r="15" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="46" y="261.76" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="76" y="250" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">a 를 읽는다 → 맨 앞으로 이동</text><text x="76" y="274" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">읽기도 '사용'이다</text><text x="495" y="224" font-size="13" fill="#184f95" font-weight="600" text-anchor="middle">head</text><text x="755" y="224" font-size="13" fill="#a63f16" font-weight="600" text-anchor="middle">tail</text><rect x="440" y="232" width="110" height="50" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><text x="495" y="265" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">a</text><line x1="552" y1="257" x2="568" y2="257" stroke="#52514e" stroke-width="1.8"/><rect x="570" y="232" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="625" y="265" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">c</text><line x1="682" y1="257" x2="698" y2="257" stroke="#52514e" stroke-width="1.8"/><rect x="700" y="232" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="755" y="265" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">b</text><rect x="850" y="232" width="90" height="50" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="5 4"/><text x="895" y="265" font-size="20" fill="#898781" font-weight="600" text-anchor="middle">a</text><text x="895" y="298" font-size="13" fill="#52514e" font-weight="600" text-anchor="middle">원래 자리</text><path d="M895,304 C895,334 495,334 495,286" fill="none" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#ah-blue)"/><text x="687.5" y="309" font-size="13" fill="#184f95" font-weight="600" text-anchor="middle">맨 앞으로 이동</text><line x1="28" y1="342" x2="932" y2="342" stroke="#e1e0d9" stroke-width="1.5"/><circle cx="46" cy="398" r="15" fill="#2a78d6" stroke="none" stroke-width="1.5"/><text x="46" y="403.76" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="76" y="392" font-size="17" fill="#0b0b0b" font-weight="700" text-anchor="start">d 를 저장 (가득 참) → 맨 뒤 b 를 축출</text><text x="76" y="416" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">만료된 키가 있으면 그것부터 정리</text><text x="495" y="366" font-size="13" fill="#184f95" font-weight="600" text-anchor="middle">head</text><text x="755" y="366" font-size="13" fill="#a63f16" font-weight="600" text-anchor="middle">tail</text><rect x="440" y="374" width="110" height="50" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="2"/><text x="495" y="407" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">d</text><line x1="552" y1="399" x2="568" y2="399" stroke="#52514e" stroke-width="1.8"/><rect x="570" y="374" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="625" y="407" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">a</text><line x1="682" y1="399" x2="698" y2="399" stroke="#52514e" stroke-width="1.8"/><rect x="700" y="374" width="110" height="50" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="755" y="407" font-size="20" fill="#0b0b0b" font-weight="600" text-anchor="middle">c</text><rect x="850" y="374" width="90" height="50" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4"/><text x="895" y="407" font-size="20" fill="#a63f16" font-weight="700" text-anchor="middle">b</text><text x="895" y="440" font-size="14" fill="#a63f16" font-weight="700" text-anchor="middle">✗ 축출</text><line x1="812" y1="399" x2="848" y2="399" stroke="#eb6834" stroke-width="2.2" marker-end="url(#ah-orange)"/></svg>