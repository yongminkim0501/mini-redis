<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',system-ui,sans-serif" role="img" aria-label="요청 횟수를 줄이면 고정 비용도 줄어든다"><title>요청 횟수를 줄이면 고정 비용도 줄어든다</title><desc>mget 없이는 요청 1,000번에 고정 비용을 1,000번 내지만, mget은 요청 1번에 한 번만 낸다</desc><defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect x="1" y="1" width="958" height="418" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="2"/><text x="28" y="42" font-size="21" fill="#0b0b0b" font-weight="700" text-anchor="start">요청 횟수를 줄이면 고정 비용도 줄어든다</text><rect x="24" y="64" width="444" height="336" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/><text x="44" y="98" font-size="18" fill="#a63f16" font-weight="700" text-anchor="start">배치 없이 — 요청 1,000번</text><rect x="44" y="160" width="100" height="64" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="94.0" y="197.2" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">클라이언트</text><rect x="348" y="160" width="100" height="64" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="398.0" y="197.2" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">서버</text><line x1="148" y1="168.0" x2="344" y2="168.0" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah-orange)"/><line x1="148" y1="177.6" x2="344" y2="177.6" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah-orange)"/><line x1="148" y1="187.2" x2="344" y2="187.2" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah-orange)"/><line x1="148" y1="196.8" x2="344" y2="196.8" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah-orange)"/><line x1="148" y1="206.4" x2="344" y2="206.4" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah-orange)"/><line x1="148" y1="216.0" x2="344" y2="216.0" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ah-orange)"/><text x="246" y="150" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">GET /keys/k1</text><text x="246" y="250" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">⋮   GET /keys/k1000</text><text x="246" y="300" font-size="20" fill="#a63f16" font-weight="700" text-anchor="middle">× 1,000</text><rect x="44" y="322" width="404" height="60" rx="10" fill="#fdeae1" stroke="#eb6834" stroke-width="1.5"/><text x="246.0" y="346.8" font-size="15" fill="#a63f16" font-weight="600" text-anchor="middle">요청마다 헤더 처리 + 왕복 지연</text><text x="246.0" y="367.8" font-size="15" fill="#a63f16" font-weight="600" text-anchor="middle">고정 비용을 1,000번 낸다</text><rect x="492" y="64" width="444" height="336" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/><text x="512" y="98" font-size="18" fill="#184f95" font-weight="700" text-anchor="start">mget / mset — 요청 1번</text><rect x="512" y="160" width="100" height="64" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="562.0" y="197.2" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">클라이언트</text><rect x="816" y="160" width="100" height="64" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/><text x="866.0" y="197.2" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="middle">서버</text><line x1="616" y1="192" x2="812" y2="192" stroke="#2a78d6" stroke-width="7" marker-end="url(#ah-blue)"/><text x="714" y="168" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="middle">POST /mget</text><text x="714" y="222" font-size="14" fill="#52514e" font-weight="400" text-anchor="middle">{ keys: [ 1,000개 ] }</text><text x="714" y="300" font-size="20" fill="#184f95" font-weight="700" text-anchor="middle">× 1</text><rect x="512" y="322" width="404" height="60" rx="10" fill="#e3effc" stroke="#2a78d6" stroke-width="1.5"/><text x="714.0" y="346.8" font-size="15" fill="#184f95" font-weight="600" text-anchor="middle">한 번의 동기 실행</text><text x="714.0" y="367.8" font-size="15" fill="#184f95" font-weight="600" text-anchor="middle">→ 서로 일관된 스냅샷</text></svg>